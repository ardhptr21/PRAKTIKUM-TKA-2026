services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - dai-gurren-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - dai-gurren-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=simon
      - GF_SECURITY_ADMIN_PASSWORD=gigadrillbreaker
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - dai-gurren-network

  node-app:
    build: ./node-app
    container_name: node-app
    ports:
      - "3001:3001"
    networks:
      - dai-gurren-network

networks:
  dai-gurren-network:

volumes:
  prometheus_data:
  grafana_data: